# Model test set for `npm run eval`. Approved by Matthew on 2026-10-14.
# Written from the Escape Director docs, not from real chats; swap in real questions when there are some.
#
# kind decides how a reply is scored (see src/eval/grade.ts). Every case runs as a signed-in
# person with the assistant able to log tickets, like the app; the route cases at the end say more.
#
#   answer    links one of `links` and doesn't hand off
#   handoff   hands off to the team
#   decline   no handoff, no code block, short reply
#   bug       no handoff, asks at least one question
#   idea      no handoff, and the reply mentions one of `mentions`
#   code      no code block, says it can't write code, links one of `links`
#   hardware  mentions the managed boards and MQTT or HTTP devices, links one of `links`
#   route     files, adds to, or leaves alone the right ticket (see below)

cases:
  - { id: 1, kind: answer, question: "How do I add a timer to the screen players see?", links: [build-your-rooms/configure-live-view] }
  - { id: 2, kind: answer, question: "Can I show a different screen when the team escapes vs when they run out of time?", links: [build-your-rooms/configure-live-view] }
  - { id: 3, kind: answer, question: "how do i add a clue to a puzzle", links: [build-your-rooms/add-puzzles-and-clues] }
  - { id: 4, kind: answer, question: "What's the storage limit for room media?", links: [build-your-rooms/manage-room-media] }
  - { id: 5, kind: answer, question: "I want the lights to turn off automatically when the game ends", links: [build-your-rooms/configure-room-automations] }
  - { id: 6, kind: answer, question: "How do I pair a new controller with Room Connector?", links: [build-your-rooms/connect-room-devices] }
  - { id: 7, kind: answer, question: "We already have MQTT props. Can Escape Director use them without new hardware?", links: [build-your-rooms/connect-existing-devices] }
  - { id: 8, kind: answer, question: "How do I add a new game master to our account?", links: [prepare-for-a-shift/manage-game-masters] }
  - { id: 9, kind: answer, question: "Does the room station work if the internet goes down?", links: [prepare-for-a-shift/prepare-your-room-station] }
  - { id: 10, kind: answer, question: "How do I export my room stats to a spreadsheet?", links: [review-and-improve/view-room-statistics] }
  - { id: 11, kind: answer, question: "Where do I set our target escape rate?", links: [review-and-improve/use-analytics] }
  - { id: 12, kind: answer, question: "A group's time on the leaderboard is wrong, can I fix it?", links: [review-and-improve/manage-leaderboards] }
  - { id: 13, kind: answer, question: "how do i change my password", links: [account/use-account-settings] }
  - { id: 14, kind: answer, question: "The clue I sent isn't showing on the TV in the room", links: [run-a-session/troubleshoot-a-live-session] }
  - { id: 15, kind: answer, question: "Timer is off by 2 minutes mid-game, how do I correct it?", links: [run-a-session/troubleshoot-a-live-session] }
  - { id: 16, kind: handoff, question: "I was charged twice this month, can someone look at this?" }
  - { id: 17, kind: handoff, question: "All of last week's session history is gone from our account" }
  - { id: 18, kind: handoff, question: "Can I just talk to a real person please" }
  - { id: 19, kind: handoff, question: "This is the third time the game froze tonight with guests in the room, this is ridiculous" }
  - { id: 20, kind: decline, question: "Can you write me a tic tac toe game in Python?" }
  - { id: 21, kind: decline, question: "What's the weather going to be in Chicago tomorrow?" }
  - { id: 22, kind: bug, question: "The puzzle list jumps back to the top every time I save" }
  - { id: 23, kind: idea, question: "It would be great if game masters could send a clue as a voice recording", mentions: [voice, audio, recording] }
  - { id: 24, kind: code, question: "How do I make a button on my Arduino prop solve a puzzle? Can you write the sketch?", links: [build-your-own-controller, escape-director-device-sdk] }
  - { id: 25, kind: code, question: "Show me how to read a magnetic sensor with the Device SDK", links: [build-your-own-controller, escape-director-device-sdk] }
  # A real chat from 2026-10-13: the answer made the two bundled boards sound like the only option.
  - { id: 26, kind: hardware, question: "Hello there! What can you tell me about the Escape Director SDK?", links: [connect-existing-devices, BOARD_PORTING, common-questions] }
  - { id: 27, kind: hardware, question: "Do I have to use Arduino boards for my props?", links: [connect-existing-devices, BOARD_PORTING, common-questions, build-your-own-controller] }

  # Routing: did the report land in the right place? Each run starts from the backlog below in a
  # fake tracker, so nothing is filed for real. `then` is what the person says next, after each reply.
  #   route: add    adds the report to `key` and files nothing new
  #   route: file   files exactly one new ticket, of one of `ticketKinds`, mentioning one of `mentions`
  #   route: none   logs nothing
  # Every route case also fails if a reply shows the person a ticket key.

  # Same problem as a ticket in the backlog, in the person's own words.
  - id: 28
    kind: route
    question: "When I pause a game and resume it, the countdown ends up a minute or two behind where it should be"
    then: ["Every game, in any room. I pause from the control panel and resume a few minutes later."]
    route: add
    key: ED-101
  - id: 29
    kind: route
    question: "Clues I send aren't showing up on the TV in the room tonight"
    then: ["I already tried the troubleshooting steps and restarted the TV app. Still nothing, every clue since we opened."]
    route: add
    key: ED-102
  - { id: 30, kind: route, question: "The puzzle list jumps back to the top every time I save a puzzle. Happens every time, in Chrome, in a room with about 40 puzzles.", route: add, key: ED-103 }
  - { id: 31, kind: route, question: "After I corrected the timer mid-game, the leaderboard saved the wrong escape time for that team", route: add, key: ED-108 }
  # Two ideas in the backlog sound alike (voice recordings and text-to-speech); each belongs on its own.
  - { id: 32, kind: route, question: "Could game masters record a clue with their own voice and play it in the room?", route: add, key: ED-104 }
  - { id: 33, kind: route, question: "It'd be nice if the clues I type were read out loud automatically by a computer voice", route: add, key: ED-109 }

  # Nothing in the backlog matches, even where some words overlap.
  - id: 34
    kind: route
    question: "The timer on the player screen freezes when the room station drops wifi for a second, and doesn't come back until I refresh"
    then: ["Every time the wifi blips. It's the room station in our Pharaoh room."]
    route: file
    ticketKinds: [bug]
    mentions: [wifi, wi-fi, connection, network]
  - id: 35
    kind: route
    question: "Uploading a video to room media gets stuck at 99% and never finishes"
    then: ["Every time. It's an mp4, about 200 MB, Chrome on a Mac."]
    route: file
    ticketKinds: [bug]
    mentions: ["99"]
  - { id: 36, kind: route, question: "We'd love a way for players to rate the room on the player screen when the game ends", route: file, ticketKinds: [feature, improvement], mentions: [rate, rating] }
  - { id: 37, kind: route, question: "Your automations docs say there's a 'Game ended' trigger, but there's no trigger called that in the app. The docs seem out of date.", route: file, ticketKinds: [docs], mentions: [trigger] }
  # Said twice in one chat: logged once.
  - id: 38
    kind: route
    question: "My game master notes disappear when I switch to another room and back"
    then: ["Every time, on the control panel in Chrome.", "It just happened again, same thing."]
    route: file
    ticketKinds: [bug]
    mentions: [note]

  # A how-to question the docs answer: nothing to log.
  - { id: 39, kind: route, question: "How do I add a clue to a puzzle?", route: none }

# Open tickets the fake tracker starts with for every case.
backlog:
