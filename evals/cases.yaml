  - { key: ED-102, kind: bug, title: "Clues sent from the control panel don't appear on the room TV" }
  - { key: ED-103, kind: bug, title: "Puzzle list scrolls back to the top after saving a puzzle" }
  - { key: ED-104, kind: feature, title: "Send clues as voice recordings from the game master" }
  - { key: ED-105, kind: feature, title: "Weekly email with room statistics" }
  - { key: ED-106, kind: improvement, title: "Reorder puzzles by drag and drop" }
  - { key: ED-107, kind: docs, title: "Docs don't explain how to reset a Room Connector" }
  - { key: ED-108, kind: bug, title: "Leaderboard records the wrong escape time after a timer correction" }
