# Wicket settings: how the assistant behaves for whom, and where.
# Copy to config/wicket.yaml, or paste the whole thing into the WICKET_CONFIG variable.
# Secrets and connections (model key, Discord, Linear, IDENTITY_SECRET) stay in environment variables.

# The widget's look. Same fields as Wicket.init({ theme }); options passed to init() win.
theme:
  accentColor: "#4f46e5"
  mode: auto                 # auto | light | dark
  # radius: 20
  # fontFamily: Inter, sans-serif
  # position: right
  # cssVars: { --wk-bg: "#fffaf5" }

team:
  # replyTime: a few hours   # "Passed to the team. They usually reply within a few hours."

# Attachments are removed this many days after they're sent (0 keeps them forever). Uploads
# that never get sent go after a day. Copies posted to Discord follow Discord's own rules.
# files:
#   keepDays: 90

# A profile is a way of answering. Everything in it is optional.
# Other repos or sites to search besides the main docs (DOCS_GITHUB_REPO or DOCS_URL), such as an SDK.
# knowledge:
#   - github: acme/acme-sdk
#     include: ["*.md", "examples/**"]   # globs; markdown only when left out. Code files are read whole.
#     exclude: [CHANGELOG.md]
#     baseUrl: https://sdk.acme.com      # optional; links go to GitHub otherwise
#   - url: https://help.acme.com          # a hosted site, read from its sitemap or by following links
#     maxPages: 200                       # optional; 500 when left out

profiles:
  # Applies when no rule matches.
  default:
    ai: true                 # false sends every message straight to the team
    budget: 0.50             # dollars per person per month; leave out for no limit.
                             # Spend in every profile counts toward one total per person;
                             # each profile's budget is where that profile stops answering.
    # instructions: Extra guidance added to the assistant's prompt.
    # offTopic: decline          # decline (default): turn down anything unrelated to the product,
    #                            # like writing code or homework. allow: help with anything.
    # topics: escape room operations in general   # other subjects it may help with
    # model: claude-sonnet-5-5   # defaults to AGENT_MODEL
    # effort: low                # low | medium | high | xhigh | max
    # askEmail: false            # offer an email field so the team can follow up
    # What the widget shows (options passed to Wicket.init() win over these):
    # title: Help & feedback
    # assistantName: Assistant   # the name under the assistant's messages
    # subtitle: Ask, report a problem or share an idea
    # welcomeTitle: Hi there 👋
    # welcomeSubtitle: How can we help you today?
    # placeholder: Write a message…
    # suggestions: ["I have a question", "Something's not working", "I have an idea"]

  visitor:
    ai: false
    askEmail: true

  billing:
    instructions: Never guess about charges or refunds. Hand off to a person for anything about a specific invoice.
    suggestions: ["Change my plan", "Download an invoice"]

# Rules pick a profile. The first one that matches wins; with none, "default" applies.
#   signedIn: true/false   only a valid signed user token counts (see IDENTITY_SECRET)
#   plan: pro              or a list: [pro, team]; the "plan" claim in the user token
#   page: /settings/billing  that page and everything below it; "*" is a wildcard; or a list
rules:
  - when: { signedIn: false }
    profile: visitor
  - when: { page: /settings/billing }
    profile: billing

budgets:
  warnAt: 0.8                # tell people when they've used 80% of their budget
  # monthlyTotal: 20         # dollars per month across everyone; then every chat goes to the team
  # prices:                  # dollars per million tokens, for models Wicket doesn't know yet
  #   some-provider/some-model: { input: 1, output: 4, cacheRead: 0.1 }
