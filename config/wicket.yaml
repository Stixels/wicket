# Escape Director. See wicket.example.yaml for every option.

# ED's dark theme and brand red (src/theme.ts in the frontend).
theme:
  accentColor: "#DD3333"
  mode: dark
  cssVars:
    --wk-bg: "#181414"
    --wk-surface: "#0f0b0b"
    --wk-bubble: "#221d1d"
    --wk-border: "rgba(255,255,255,0.07)"
    --wk-text: "#EDEDEF"
    --wk-muted: "#8A8F98"
    # Your own messages are a quiet gray; red stays for buttons and the brand.
    --wk-user: "#2a2424"
    --wk-user-text: "#EDEDEF"
    --wk-user-border: "rgba(255,255,255,0.09)"

team:
  replyTime: a few hours

# Everywhere: the assistant doesn't write code; it links the closest guide or example.
assistant:
  code: decline
  # Discord members aren't signed in, so #help answers couldn't be metered per person. People answer there.
  helpForum: false

# The Device SDK (Arduino), so the assistant can answer from its guides and examples.
knowledge:
  - github: directorhq/escape-director-device-sdk
    include: ["*.md", "examples/**/*.ino", "src/EscapeDirectorRoom.h"]
    exclude: [THIRD_PARTY.md, TRADEMARKS.md]

profiles:
  # Marketing site, sign-in and sign-up. Everyone here shares one small pot, then messages go to
  # the team. No bot check for now: the pot caps the cost, and botCheck can be turned on later. Visitors can't log reports: we couldn't follow up with them.
  visitor:
    budget: 3.00
    budgetScope: shared
    tickets: false
    askEmail: true
    instructions: >
      This person isn't signed in. If they report a bug or share an idea, thank them and point them to
      the #ideas forum in the Escape Director Discord (https://discord.gg/tRDXj9x6SF), or ask them to
      sign in if they're a customer, so the team can follow up.

  # Signed in, any page. ED's token carries the account's allowance ($3 per Location a month), and
  # every answer from everyone on the account counts toward it.
  default:
    followUps: true
    appTools:
      url:
        production: https://api.escapedirector.com/api/v1/integrations/wicket/tools
        staging: https://staging-api.escapedirector.com/api/v1/integrations/wicket/tools

  # The Analytics page: the model benchmarked for analytics questions (ED-399), and today's five questions.
  analytics:
    model: openai/gpt-6-luna
    effort: medium
    # As the old Analytics assistant did: OpenAI only, and OpenAI doesn't store the response.
    providerOptions:
      gateway: { only: [openai] }
      openai: { store: false }
    followUps: true
    appTools:
      url:
        production: https://api.escapedirector.com/api/v1/integrations/wicket/tools
        staging: https://staging-api.escapedirector.com/api/v1/integrations/wicket/tools
    instructions: >
      The person is on the Analytics page. Questions like "this Room" mean the Room and dates in
      <app_context>. Use the app's tools for any number about their games, and the docs for what a
      metric means.
    suggestions:
      - What stands out about this Room?
      - Are any Puzzles taking too long to solve?
      - Are any Puzzles using too many Clues?
      - How are my Game Masters performing?
      - Is this Room's Success Rate improving or declining?

rules:
  - when: { signedIn: false }
    profile: visitor
  - when: { page: /app/analytics }
    profile: analytics

budgets:
  warnAt: 0.8
  monthlyTotal: 20  # every account's own allowance is checked first
