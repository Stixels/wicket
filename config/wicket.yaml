# Escape Director. See wicket.example.yaml for every option.

# ED's dark theme and brand red (src/theme.ts in the frontend).
theme:
  accentColor: "#DD3333"
  mode: dark
  cssVars:
    --wk-bg: "#181414"
    --wk-surface: "#0f0b0b"
    --wk-bubble: "#221d1d"
    --wk-border: "rgba(255,255,255,0.07)"
    --wk-text: "#EDEDEF"
    --wk-muted: "#8A8F98"

team:
  replyTime: a few hours

# Everywhere: no code from the assistant, and hardware support stated in full.
assistant:
  code: decline
  instructions: >
    When someone asks which hardware or props work with Escape Director, give both ways to
    connect, so the boards in the quickstart don't sound like the only option.
    (1) The managed setup: the Device SDK with Room Connector pairs the Arduino UNO R4 WiFi
    and GIGA R1 WiFi today, and other boards can run the SDK with an adapter (BOARD_PORTING.md
    in the SDK). (2) Any prop that already speaks MQTT or HTTP connects without new firmware
    through Connect Existing Devices.
    When someone wants code for a prop, point them to the Device SDK: it is built for coding
    agents (its AGENTS.md), and the "Build your prop with a coding agent" section of
    Build Your Own Controller shows how.

# The Device SDK (Arduino), so the assistant can answer from its guides and examples.
knowledge:
  - github: directorhq/escape-director-device-sdk
    include: ["*.md", "examples/**/*.ino", "src/EscapeDirectorRoom.h"]
    exclude: [THIRD_PARTY.md, TRADEMARKS.md]

profiles:
  # Marketing site, sign-in and sign-up: no assistant, so nothing to abuse.
  visitor:
    ai: false
    askEmail: true
    welcomeSubtitle: Send us a message and the team will reply here.

  # Budgets are one pot per person: spend in any profile counts toward it,
  # and each profile's number is where that profile stops answering.
  default:
    budget: 3.00

  analytics:
    budget: 3.00
    instructions: >
      The person is on the Analytics page. Explain what a metric or chart means using the docs.
      You can't see their numbers; for questions about their own results, point them to the
      Ask Analytics assistant on this page.
    suggestions: ["What does Success Rate mean?", "How is Average Time calculated?", "Something looks wrong"]

rules:
  - when: { signedIn: false }
    profile: visitor
  - when: { page: /app/analytics }
    profile: analytics

budgets:
  warnAt: 0.8
  monthlyTotal: 20
